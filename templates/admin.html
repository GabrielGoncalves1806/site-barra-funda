<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Administração • {{ display_name }}</title>
  <link rel="stylesheet" href="{{ static_url('css/styles.css') }}" />
  <link rel="stylesheet" href="{{ static_url('admin/admin.css') }}" />
  <style>
    :root {
      --accent: {{ config.identity.accent }};
      --accent-rgb: {{ config.identity.accent | hex_to_rgb }};
      --accent2: {{ config.identity.accent2 }};
    }
  </style>
</head>

<body>
  <div class="login-overlay hidden" id="loginOverlay">
    <div class="login-box">
      <div class="login-box__logo" aria-hidden="true">{{ config.identity.logo }}</div>
      <h2>{{ display_name }}</h2>
      <p>Área restrita do síndico e da administração</p>
      <form id="loginForm">
        <div class="form-group">
          <label class="sr-only" for="adminPassword">Senha</label>
          <input type="password" id="adminPassword" placeholder="Digite a senha" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-admin btn-admin--primary login-box__submit">Entrar</button>
        <p class="login-error" id="loginError" role="alert" hidden></p>
      </form>
    </div>
  </div>

  <div class="admin-shell hidden" id="adminPanel">
    <aside class="sidebar" id="sidebar" aria-label="Menu do painel">
      <div class="sidebar__brand">
        <span class="sidebar__logo" aria-hidden="true">{{ config.identity.logo }}</span>
        <strong id="brandName" data-fallback="{{ condominium.name }}">{{ display_name }}</strong>
      </div>
      <a class="sidebar__portal" href="/" target="_blank" rel="noopener">↗ Ver portal</a>
      <nav id="sidebarNav"></nav>
      <button type="button" class="btn-admin btn-admin--ghost sidebar__logout" id="logoutBtn">Sair</button>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="btn-admin btn-admin--ghost menu-toggle" id="menuToggle"
          aria-controls="sidebar" aria-expanded="false">☰ Menu</button>
        <h1 id="screenTitle"></h1>
      </header>
      <div id="screen"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="{{ static_url('admin/app.js') }}"></script>
</body>

</html>
